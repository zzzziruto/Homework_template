<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 모바일 필수: 이 태그가 없으면 폰에서 PC용 화면처럼 축소되어 터치가 스크롤/확대로 해석됨 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no"
    />
    <title>과제 모음</title>
    <style>
      /* 허브 페이지는 절대 스크롤/선택되지 않게 고정 (아이폰에서 터치가 페이지 스크롤로 새는 것 방지) */
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        font-family: sans-serif;
      }
      /* 왼쪽 메뉴 */
      #menu {
        position: fixed;
        top: 0;
        left: 0;
        width: 100px;
        height: 100%;
        padding: 20px;
        box-sizing: border-box;
        background: #fff;
      }
      #menu a {
        display: block;
        margin-bottom: 10px;
        cursor: pointer;
        color: blue;
      }
      #menu .project-launch {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        margin: 22px -10px 0;
        padding: 13px 5px;
        border: 1px solid #222;
        border-radius: 12px;
        background: #f6f5f2;
        color: #222;
        text-decoration: none;
        text-align: center;
      }
      .project-launch .project-number { font-size: 10px; color: #777; }
      .project-launch strong { font-size: 13px; font-weight: 500; }
      .project-launch .project-open { font-size: 10px; }
      #menu .project-launch:hover { background: #b0ff5b; }
      #menu .project-launch:focus-visible { outline: 2px solid #222; outline-offset: 4px; }
      /* iframe 영역: 메뉴(100px)를 뺀 나머지 화면 전체 */
      #stage {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 100px;
        overflow: hidden;
      }
      #viewer {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div id="menu">
      <a onclick="loadHomework('Homework1')">Homework1</a>
      <a onclick="loadHomework('Homework2')">Homework2</a>
      <a class="project-launch" href="Homework3/index.html?v=0eec22ac1daa" target="_blank" rel="noopener noreferrer" aria-label="Homework3 중간과제 새 창에서 열기">
        <span class="project-number">Homework3</span>
        <strong>중간과제</strong>
        <span class="project-open">새 창 열기 ↗</span>
      </a>
    </div>

    <div id="stage">
      <!-- 처음 열었을 때 보여줄 과제 -->
      <iframe id="viewer" src="Homework1/index.html"></iframe>
    </div>

    <script>
      // 메뉴 클릭 시 iframe에 해당 폴더의 index.html을 불러옴
      function loadHomework(folderName) {
        document.getElementById("viewer").src = folderName + "/index.html" + (folderName === "Homework2" ? "?v=dream-20261005-2" : "");
      }
    </script>
  </body>
</html>
